name: Build and Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY" || true
        sudo apt-get clean || true
        df -h /

    - name: Make build.sh executable
      run: chmod +x ./build.sh

    - name: Run build script
      run: ./build.sh

    - name: List build outputs
      if: always()
      run: |
        echo "=== bin/targets tree ==="
        find ./openwrt/bin/targets -maxdepth 4 -type f 2>/dev/null | sort || echo "no bin/targets"

    - name: Upload images as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-en7528-images
        if-no-files-found: warn
        retention-days: 30
        path: |
          ./openwrt/bin/targets/econet/en7528/*.trx
          ./openwrt/bin/targets/econet/en7528/*.bin
          ./openwrt/bin/targets/econet/en7528/*.itb
          ./openwrt/bin/targets/econet/en7528/*sysupgrade*
          ./openwrt/bin/targets/econet/en7528/*factory*
          ./openwrt/bin/targets/econet/en7528/sha256sums
          ./openwrt/bin/targets/econet/en7528/config.buildinfo
